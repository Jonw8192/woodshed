services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-woodshed}
      POSTGRES_USER: ${POSTGRES_USER:-woodshed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-woodshed}"], interval: 5s, timeout: 3s, retries: 20}
    security_opt: ["no-new-privileges:true"]
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redis_data:/data"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
    security_opt: ["no-new-privileges:true"]
  api:
    build: {context: ., dockerfile: Dockerfile.api}
    env_file: backend/.env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
  web:
    build: {context: ., dockerfile: Dockerfile.web, args: {NEXT_PUBLIC_API_URL: "/api/v1"}}
    depends_on: [api]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
  gateway:
    image: nginx:1.27-alpine
    ports: ["8080:8080"]
    volumes: ["./deployment/nginx/woodshed.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [web, api]
    read_only: true
    tmpfs: ["/var/cache/nginx", "/var/run", "/tmp"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
volumes: {postgres_data: {}, redis_data: {}}
