[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "woodshed-api"
version = "1.1.0"
description = "The Woodshed fantasy football decision API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn[standard]==0.48.0",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "sqlalchemy==2.0.50",
  "asyncpg==0.30.0",
  "redis==5.2.1",
  "python-json-logger==3.3.0",
  "numpy==2.3.5",
  "alembic==1.18.4",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "pytest-cov==6.2.1",
  "ruff==0.12.9",
  "pip-audit==2.9.0",
]
ai = ["openai==1.102.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
